name: crypto-intel

on:
  schedule:
    - cron: "*/30 * * * *"      # every 30 minutes (UTC). GitHub may delay under load.
  workflow_dispatch:            # allow manual run from the Actions tab

permissions:
  contents: write               # needed to commit the forecast log back

concurrency:
  group: crypto-intel
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run analysis + post to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          COINGLASS_API_KEY: ${{ secrets.COINGLASS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          COINS: "BTC,ETH,SOL,BNB,XRP,DOGE"
          TIER: "pro"
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
        run: python main.py
      - name: Commit forecast log + dashboard
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/forecasts.csv docs/ || true
          git diff --staged --quiet || git commit -m "update $(date -u +%FT%TZ)"
          git push
